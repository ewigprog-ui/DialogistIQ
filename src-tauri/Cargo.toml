[package]
name = "studio"
version = "0.1.0"
description = "Desktop writing studio for screenwriters and novelists"
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix avoids a name clash between lib and bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
